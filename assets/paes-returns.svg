one" stroke="#141414" stroke-width="1"/><text x="600" y="277" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Garment received</text><path d="M600 150V229" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><text x="608" y="168" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">returned garment</text><path d="M616 245H640V390H658" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="658.0" y="362.0" width="124" height="56" rx="7" fill="#ececec" stroke="#141414" stroke-width="2"/><text x="720" y="380.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Inspect garment</text><text x="720" y="393.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">against return</text><text x="720" y="406.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">policy</text><path d="M782 390H832" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M860 362L888 390L860 418L832 390Z" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><path d="M852 382L868 398M868 382L852 398" stroke="#141414" stroke-width="2.2"/><text x="826" y="360" text-anchor="end" font-weight="400" font-size="10" fill="#5f5f5f">Policy met?</text><path d="M860 418V530H938" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="868" y="436" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">yes</text><rect x="938.0" y="502.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="1000" y="520.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Refund to the</text><text x="1000" y="533.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">original payment</text><text x="1000" y="546.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">method</text><path d="M1062 530H1114" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="1130" cy="530" r="16" fill="#ffffff" stroke="#141414" stroke-width="3.2"/><text x="1130" y="565.33" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Return closed</text><path d="M860 362V245H938" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="868" y="261" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">no</text><rect x="938.0" y="217.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="1000" y="235.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Explain the</text><text x="1000" y="248.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">outcome to the</text><text x="1000" y="261.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">customer</text><path d="M1062 245H1114" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="1130" cy="245" r="16" fill="#ffffff" stroke="#141414" stroke-width="3.2"/><text x="1130" y="274.33" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Return</text><text x="1130" y="286.33" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">declined</text><path d="M1000 217V150" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><path d="M1062 520H1085V150" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><text x="1093" y="168" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">refund</text><text x="20" y="652" text-anchor="start" font-weight="400" font-size="10.5" fill="#5f5f5f">Every return is checked against the internal return policy, within current consumer law, before any refund is made.</text></svg>
