text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">pickup booking</text><path d="M820 284V150" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><text x="828" y="168" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">booking</text><path d="M1330 232V150" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><text x="1338" y="168" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">parcels</text><path d="M520 288V450H538" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="538.0" y="422.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="600" y="447.0" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Pick garments</text><text x="600" y="460.0" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">by design and size</text><path d="M662 450H718" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="718.0" y="422.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="780" y="440.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Quality check</text><text x="780" y="453.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">(loose threads,</text><text x="780" y="466.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">stains)</text><path d="M842 450H882" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M910 422L938 450L910 478L882 450Z" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><path d="M902 442L918 458M918 442L902 458" stroke="#141414" stroke-width="2.2"/><text x="910" y="412" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Passes QC?</text><path d="M938 450H998" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="950" y="442" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">yes</text><rect x="998.0" y="422.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="1060" y="440.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Pack: custom box,</text><text x="1060" y="453.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">handwritten card,</text><text x="1060" y="466.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">brand fabric scent</text><path d="M1060 422V350" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M910 478V522" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="918" y="496" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">no</text><rect x="848.0" y="522.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="910" y="547.0" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Report fault</text><text x="910" y="560.0" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">immediately</text><path d="M848 550H808" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M780 522L808 550L780 578L752 550Z" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><path d="M772 542L788 558M788 542L772 558" stroke="#141414" stroke-width="2.2"/><text x="800" y="596" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">Replacement in stock?</text><path d="M752 550H702" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="740" y="542" text-anchor="end" font-weight="400" font-size="10" fill="#5f5f5f">yes</text><rect x="578.0" y="522.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="640" y="540.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Swap garment,</text><text x="640" y="553.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">faulty item</text><text x="640" y="566.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">to repairs</text><path d="M640 522V500H770V478" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><path d="M780 578V667" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><text x="770" y="596" text-anchor="end" font-weight="400" font-size="10" fill="#5f5f5f">no</text><rect x="718.0" y="667.0" width="124" height="56" rx="7" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/><text x="780" y="685.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Agree a same-day</text><text x="780" y="698.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">solution with</text><text x="780" y="711.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">the customer</text><path d="M842 695H884" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="900" cy="695" r="16" fill="#ffffff" stroke="#141414" stroke-width="3.2"/><text x="900" y="730.3333333333334" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Order adjusted</text><path d="M1480 288V667" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="1418.0" y="667.0" width="124" height="56" rx="7" fill="#ececec" stroke="#141414" stroke-width="2"/><text x="1480" y="685.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Send tracking code</text><text x="1480" y="698.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">via Shopify or</text><text x="1480" y="711.5" text-anchor="middle" font-weight="400" font-size="10.5" fill="#141414">Instagram</text><path d="M1542 695H1594" fill="none" stroke="#3a3a3a" stroke-width="1.1" marker-end="url(#arrow)"/><circle cx="1610" cy="695" r="16" fill="#ffffff" stroke="#141414" stroke-width="3.2"/><text x="1610" y="724.3333333333334" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">Order</text><text x="1610" y="736.3333333333334" text-anchor="middle" font-weight="400" font-size="10" fill="#5f5f5f">dispatched</text><path d="M780 723V790" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><text x="788" y="782" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">solution offer</text><path d="M1480 723V790" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-dasharray="5 4" marker-start="url(#msgstart)" marker-end="url(#msgend)"/><text x="1488" y="782" text-anchor="start" font-weight="400" font-size="10" fill="#5f5f5f">tracking code</text><line x1="20" y1="850" x2="1660" y2="850" stroke="#c9c9c9" stroke-width="1"/><text x="20" y="868" text-anchor="start" font-weight="600" font-size="12" fill="#141414">What changed</text><text x="20" y="890" text-anchor="start" font-weight="400" font-size="10.5" fill="#5f5f5f">Before: an external runner took every order to a courier branch, and there was no timely tracking for customers.</text><text x="20" y="910" text-anchor="start" font-weight="400" font-size="10.5" fill="#141414">1. One daily picking sheet consolidating Shopify and Instagram sales, so the packing team worked from a single list.</text><text x="20" y="928" text-anchor="start" font-weight="400" font-size="10.5" fill="#141414">2. A business account with scheduled pickups and a dedicated account executive (corporate agreement with Correos Chile and courier business rates).</text><text x="20" y="946" text-anchor="start" font-weight="400" font-size="10.5" fill="#141414">3. A process log in Excel: every parcel marked complete with comments, and its tracking code sent to the customer.</text><text x="20" y="968" text-anchor="start" font-weight="600" font-size="10.5" fill="#141414">Result: logistics costs down 20% with 96% on-time delivery. Shaded tasks are the controls I introduced.</text></svg>
